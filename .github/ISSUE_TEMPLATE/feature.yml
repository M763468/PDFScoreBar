name: "Feature / 新機能"
description: "新機能や実装タスクの提案"
title: "[Feature] <短い要約>"
labels:
  - "feature"
  - "priority:med"
  - "scope:medium"
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > AIエージェントにIssueの下書きを依頼する場合は `issue-creation` を利用できます。実装はこのIssueを直接指定して依頼してください。専用の実装skillは不要です。

  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Issue
        目的・背景・入出力・完了条件を明確に書いてください。

  - type: markdown
    attributes:
      value: |
        ## ブランチ運用
        AIエージェントが作業するブランチを指定します。未定なら空欄でもOKで、あとからコメント等で指定できます。

  - type: input
    id: base_branch
    attributes:
      label: "Base branch"
      description: "作業ブランチの元となる親ブランチ名を指定します。"
      placeholder: "例: develop"

  - type: input
    id: branch_name
    attributes:
      label: "Branch name"
      description: "AIが作成する作業ブランチ名を指定します。"
      placeholder: "例: feature/123-new-feature"

  - type: input
    id: pr_base
    attributes:
      label: "PR base"
      description: "PRの向き先となるブランチ（通常はdevelop）"
      placeholder: "例: develop"

  - type: textarea
    id: goal
    attributes:
      label: "Goal（このIssueで達成したいこと）"
      description: "最終的に達成したい成果を簡潔に記述。"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "Background / Context（なぜ必要か）"
      description: "背景・課題・前提を記述。"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "Scope（In / Out）"
      description: "このIssueでやること／やらないことを明確に。"
      placeholder: |
        In:
        -
        Out:
        -
    validations:
      required: true

  - type: textarea
    id: io
    attributes:
      label: "Inputs / Outputs（入出力仕様）"
      description: "入力と出力（ファイル名・形式・ディレクトリ）を明記。"
    validations:
      required: true

  - type: textarea
    id: cli
    attributes:
      label: "CLI usage example（想定コマンド）"
      description: "必要な場合は実行例を記載。不要ならN/A。"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria（完了条件）"
      description: "機械的に判定できるDone条件。結果を見た後に別の指標へ読み替えない。"
      placeholder: |
        - 主要な入出力契約を満たす
        - 既存の関連精度・回帰ゲートを維持する
        - 必要なドキュメントが更新される
    validations:
      required: true

  - type: textarea
    id: implementation_notes
    attributes:
      label: "Implementation Notes（実装メモ）"
      description: "設計方針、ライブラリ、注意点など。"
    validations:
      required: false
