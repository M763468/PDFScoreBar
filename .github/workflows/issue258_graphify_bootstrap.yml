name: Issue 258 Graphify bootstrap

on:
  push:
    branches:
      - task/introduce-graphify

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[graphify-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GRAPHIFY_GEMINI_MODEL: ""
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: task/introduce-graphify
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip uv
          uv tool install --upgrade graphifyy
          graphify --version
          graphify install --project --platform agents

      - name: Write repository Graphify policy and entry point
        shell: bash
        run: |
          mkdir -p scripts
          cat > scripts/graphify_query.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -eq 0 ]; then
              echo 'Usage: scripts/graphify_query.sh "<question>"' >&2
              exit 2
          fi

          if ROOT=$(git rev-parse --show-toplevel 2>/dev/null); then
              cd "$ROOT"
          fi

          GRAPH="graphify-out/graph.json"
          MANIFEST="graphify-out/MANIFEST.json"
          QUESTION="$*"

          if command -v graphify >/dev/null 2>&1; then
              GRAPHIFY=(graphify)
          elif command -v uv >/dev/null 2>&1; then
              GRAPHIFY=(uv tool run --from graphifyy graphify)
          else
              echo "Graphify is unavailable. Install it with: uv tool install graphifyy" >&2
              exit 127
          fi

          rebuild_code_graph() {
              "${GRAPHIFY[@]}" extract . --code-only --force
              "${GRAPHIFY[@]}" . --cluster-only --wiki --no-viz
          }

          if [ "${GRAPHIFY_REBUILD:-0}" = "1" ]; then
              rebuild_code_graph
          elif [ ! -s "$GRAPH" ]; then
              echo "Shared Graphify graph is missing; creating a local code-only graph." >&2
              rebuild_code_graph
          elif [ "${GRAPHIFY_REFRESH:-0}" = "1" ]; then
              "${GRAPHIFY[@]}" update .
          fi

          if [ -f "$MANIFEST" ]; then
              SOURCE_COMMIT=$(python - "$MANIFEST" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(data.get("source_commit", ""))
          PY
              )
              CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
              if [ -n "$SOURCE_COMMIT" ] && [ -n "$CURRENT_COMMIT" ] && [ "$SOURCE_COMMIT" != "$CURRENT_COMMIT" ]; then
                  echo "Graphify graph was generated from $SOURCE_COMMIT; verify changed files directly or set GRAPHIFY_REFRESH=1." >&2
              fi
          fi

          "${GRAPHIFY[@]}" query "$QUESTION" --graph "$GRAPH"
          EOF
          chmod +x scripts/graphify_query.sh

          cat > docs/ai-workflow/GRAPHIFY.md <<'EOF'
          # Graphify operating procedure

          ## Purpose

          Graphify is the first-pass repository navigation aid for architecture, dependency, call-path, and relevant-file questions. Its output narrows the search space; source files and tests remain authoritative.

          ## Agent entry points

          Project-scoped Agent Skills are installed at `.agents/skills/graphify/`. Agents should use the Graphify skill before broad repository searches when the task concerns codebase structure or relationships.

          For a direct query, use:

          ```bash
          scripts/graphify_query.sh "<question>"
          ```

          The script immediately uses the committed graph when available. Set `GRAPHIFY_REFRESH=1` to incrementally update a local worktree graph, or `GRAPHIFY_REBUILD=1` to rebuild a local code-only graph.

          ## Installation

          Install the official package in an isolated tool environment:

          ```bash
          uv tool install graphifyy
          graphify install --project --platform agents
          ```

          ## Shared outputs

          Commit only reusable, portable results:

          - `graphify-out/graph.json`: canonical queryable graph, including structural and any explicitly approved semantic results.
          - `graphify-out/GRAPH_REPORT.md`: human-readable graph summary.
          - `graphify-out/wiki/**`: agent- and web-readable community/semantic map.
          - `graphify-out/MANIFEST.json`: source commit, Graphify version, generation mode, semantic route, and portability checks.

          Do not commit HTML visualization, converted sidecars, temporary extraction JSON, local interpreter/root files, or extraction caches.

          ## Code graph refresh

          The default and unattended path is code-only local AST extraction:

          ```bash
          graphify extract . --code-only --force
          graphify . --cluster-only --wiki --no-viz
          ```

          No document, PDF, or image semantic extraction is performed by this path. After a meaningful architecture change, regenerate the shared outputs intentionally and update the manifest. Ordinary feature branches may use the committed base graph and verify changed areas directly instead of committing graph churn on every task.

          ## Document semantic extraction

          Document semantics are opt-in. Never start them merely because an API key happens to exist.

          Two approved routes are available when document understanding is needed:

          1. **Local coding-session route**: assign semantic extraction to an explicitly selected local coding session. The session provider's data-handling policy still applies; do not describe this route as offline unless the model actually runs locally.
          2. **Gemini API route**: explicitly set `GEMINI_API_KEY` or `GOOGLE_API_KEY` and use the Gemini backend only after confirming the selected Google AI plan/quota will not create unintended additional charges. Do not store credentials in the repository.

          For either route:

          - Define an allowlist of documentation paths before extraction.
          - Exclude credentials, datasets, generated logs, personal notes, and other sensitive files.
          - Record the route, model/backend, scope, source commit, and Graphify version in `MANIFEST.json`.
          - Commit only the merged `graph.json`, `GRAPH_REPORT.md`, `wiki/**`, and manifest; keep intermediate semantic/cache files local.

          ## Verification rule

          Graphify results are hypotheses until confirmed in source or tests. If Graphify is missing, stale, or insufficient, fall back promptly to `rg`, `grep`, and direct source inspection.
          EOF

          python - <<'PY'
          from pathlib import Path

          for path in (Path("AGENTS.md"), Path(".agents/rules/graphify.md")):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "- **ローカル完結を既定とする**: グラフの新規生成・全面再生成は `graphify extract . --code-only --force` を使用する。コードはローカルAST解析され、ドキュメント・PDF・画像は対象外となる。",
                  "- **共有グラフを優先する**: `graphify-out/graph.json` が存在する場合は、広範な検索の前に共有グラフへ問い合わせる。新規worktreeでも `scripts/graphify_query.sh \"<question>\"` を入口とする。",
              )
              text = text.replace(
                  "- **外部送信の禁止**: 明示的な承認と承認済みのローカルバックエンドがない限り、ドキュメント・PDF・画像を含むsemantic extractionや外部APIバックエンドを使用しない。",
                  "- **code-onlyを既定とする**: 無人の生成・更新はローカルASTによるcode-onlyとする。ドキュメントsemantic extractionは、ユーザーがローカルcoding sessionまたはGemini API経路を明示的に選んだ場合だけ行う。",
              )
              text = text.replace(
                  "- **更新**: 既存のコード専用グラフは `graphify update .` で増分更新する。大規模な構造変更後や整合性に疑いがある場合は、上記のcode-only全面再生成を行う。",
                  "- **更新と共有**: 通常のbranch/worktreeでは共有グラフを利用し、変更箇所を直接確認する。大きな構造変更や明示的なsemantic refresh時だけ、`graph.json`・`GRAPH_REPORT.md`・`wiki/**`・`MANIFEST.json`を更新する。キャッシュはコミットしない。",
              )
              path.write_text(text, encoding="utf-8")

          agents = Path("AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          needle = "    - `codex-delegation`: Codex への実装・検証タスクの委譲。`.agents/skills/codex-delegation/SKILL.md` を利用し、コンテキスト消費を抑えつつ精緻な実装と検証を行います。\n"
          addition = needle + "    - `graphify`: コードベース構造・依存関係・関連ファイルの事前探索。`.agents/skills/graphify/SKILL.md` と `docs/ai-workflow/GRAPHIFY.md` に従い、共有グラフを広範検索より先に利用します。\n"
          if "    - `graphify`: コードベース構造" not in text:
              text = text.replace(needle, addition)
          agents.write_text(text, encoding="utf-8")
          PY

      - name: Generate portable shared code graph
        shell: bash
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          graphify extract . --code-only --force
          graphify . --cluster-only --wiki --no-viz

          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/wiki/index.md

          python - "$SOURCE_COMMIT" <<'PY'
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          source_commit = sys.argv[1]
          graph_path = Path("graphify-out/graph.json")
          graph_text = graph_path.read_text(encoding="utf-8")
          root = str(Path.cwd().resolve())
          absolute_root_occurrences = graph_text.count(root)
          if absolute_root_occurrences:
              raise SystemExit(
                  f"graph.json is not portable: found {absolute_root_occurrences} occurrences of {root}"
              )

          graph = json.loads(graph_text)
          manifest = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source_commit": source_commit,
              "graphify_version": subprocess.check_output(
                  ["graphify", "--version"], text=True
              ).strip(),
              "generation_mode": "code-only",
              "semantic_route": "none",
              "semantic_scope": [],
              "external_api_keys_present": False,
              "portable": True,
              "absolute_root_occurrences": absolute_root_occurrences,
              "node_count": len(graph.get("nodes", [])),
              "edge_count": len(graph.get("edges", [])),
              "tracked_outputs": [
                  "graphify-out/graph.json",
                  "graphify-out/GRAPH_REPORT.md",
                  "graphify-out/wiki/**",
                  "graphify-out/MANIFEST.json",
              ],
          }
          Path("graphify-out/MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Update generated artifact ignore policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".gitignore")
          text = path.read_text(encoding="utf-8")
          marker = "# Graphify generated artifacts\n"
          prefix, _, _ = text.partition(marker)
          block = """# Graphify generated artifacts
          # Commit portable query/report/wiki results; keep caches and local outputs ignored.
          /graphify-out/*
          !/graphify-out/graph.json
          !/graphify-out/GRAPH_REPORT.md
          !/graphify-out/MANIFEST.json
          !/graphify-out/wiki/
          !/graphify-out/wiki/**
          """
          path.write_text(prefix.rstrip() + "\n\n" + block, encoding="utf-8")
          PY

      - name: Verify worktree and web-facing artifacts
        shell: bash
        run: |
          bash -n scripts/graphify_query.sh
          scripts/graphify_query.sh "detector orchestrator pipeline" > /tmp/graphify-query.txt
          test -s /tmp/graphify-query.txt
          ! grep -R "file://" graphify-out/wiki docs/ai-workflow/GRAPHIFY.md
          git check-ignore -q --no-index graphify-out/graph.html || true
          if git check-ignore -q --no-index graphify-out/graph.json; then
            echo "graph.json must be trackable" >&2
            exit 1
          fi
          if git check-ignore -q --no-index graphify-out/GRAPH_REPORT.md; then
            echo "GRAPH_REPORT.md must be trackable" >&2
            exit 1
          fi
          if git check-ignore -q --no-index graphify-out/wiki/index.md; then
            echo "wiki must be trackable" >&2
            exit 1
          fi
          make lint

      - name: Commit generated skill and durable artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .agents/rules/graphify.md .agents/workflows/graphify.md
          git add .agents/skills/graphify scripts/graphify_query.sh docs/ai-workflow/GRAPHIFY.md .gitignore
          git add -f graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/MANIFEST.json graphify-out/wiki
          git commit -m "feat: add reusable Graphify skill and shared graph [graphify-bootstrap]"
          git push origin HEAD:task/introduce-graphify
