name: Issue 258 Graphify fresh checkout

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Query committed graph without rebuilding
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          uv tool install --upgrade graphifyy
          BEFORE=$(sha256sum graphify-out/graph.json)
          scripts/graphify_query.sh "detector orchestrator pipeline" >/tmp/query.txt 2>/tmp/query.err
          AFTER=$(sha256sum graphify-out/graph.json)
          test "$BEFORE" = "$AFTER"
          test -s /tmp/query.txt
          if grep -E "Code has changed|history diverges|provenance commit.*unavailable" /tmp/query.err; then
            echo "Unexpected stale warning in fresh checkout" >&2
            cat /tmp/query.err >&2
            exit 1
          fi
          git diff --exit-code -- graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/wiki
          bash -n scripts/graphify_query.sh
