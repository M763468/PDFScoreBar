name: Issue 258 Graphify probe

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GRAPHIFY_GEMINI_MODEL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project skill
        run: |
          python -m pip install --upgrade pip uv
          uv tool install --upgrade graphifyy
          graphify --version
          graphify install --project --platform agents
          find .agents/skills/graphify -maxdepth 2 -type f -printf '%P\n' | sort
      - name: Generate and inventory code graph
        run: |
          graphify extract . --code-only --force
          graphify . --cluster-only --wiki --no-viz
          find graphify-out -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('graphify-out/graph.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          root = str(Path.cwd().resolve())
          print('nodes=', len(data.get('nodes', [])))
          print('edges=', len(data.get('edges', [])))
          print('absolute_root_occurrences=', p.read_text(encoding='utf-8').count(root))
          PY
          graphify query "detector orchestrator pipeline" --graph graphify-out/graph.json
