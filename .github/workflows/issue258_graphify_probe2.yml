name: Issue 258 Graphify probe 2

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GRAPHIFY_GEMINI_MODEL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install and generate
        run: |
          python -m pip install --upgrade pip uv
          uv tool install --upgrade graphifyy
          graphify install --project --platform agents
          graphify extract . --code-only --force
          graphify cluster-only . --wiki --no-viz
          find .agents/skills/graphify -maxdepth 2 -type f -printf 'skill/%P\t%s bytes\n' | sort
          find graphify-out -maxdepth 2 -type f -printf 'out/%P\t%s bytes\n' | sort
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('graphify-out/graph.json')
          text = p.read_text(encoding='utf-8')
          data = json.loads(text)
          root = str(Path.cwd().resolve())
          print('nodes=', len(data.get('nodes', [])))
          print('edges=', len(data.get('edges', [])))
          print('absolute_root_occurrences=', text.count(root))
          print('graph_bytes=', p.stat().st_size)
          PY
          graphify query "detector orchestrator pipeline" --graph graphify-out/graph.json
