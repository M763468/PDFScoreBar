name: Issue 258 Graphify refinement

on:
  push:
    branches:
      - task/introduce-graphify

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[graphify-refine]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: task/introduce-graphify
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Refine repository guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = '''## Graphify利用ガイド

          このリポジトリではコードベースのナレッジグラフ化ツール `Graphify` (CLI: `graphify`) を利用できます。

          **利用ルール**:
          - **事前絞り込み**: リポジトリ全体を広範囲に検索する前に、既存グラフへ `graphify query "<question>"` などで問い合わせ、関連領域を絞り込む。
          - **ローカル完結を既定とする**: グラフの新規生成・全面再生成は `graphify extract . --code-only --force` を使用する。コードはローカルAST解析され、ドキュメント・PDF・画像は対象外となる。
          - **外部送信の禁止**: 明示的な承認と承認済みのローカルバックエンドがない限り、ドキュメント・PDF・画像を含むsemantic extractionや外部APIバックエンドを使用しない。
          - **直接確認**: Graphifyの結果だけで実装を判断せず、対象ソースを直接確認する。
          - **裏付け**: Graphifyにより推定された依存関係は、実際の実装またはテストコードで裏付ける。
          - **フォールバック**: Graphifyが失敗した場合や十分な情報が得られない場合は、通常の検索（`rg` / `grep` 等）やソース確認へ速やかにフォールバックする。
          - **過剰利用の禁止**: Graphifyを使うこと自体を目的化せず、単純な変更や調査では過剰な問い合わせをしない。
          - **ドキュメントのナビゲーション**: コードグラフを補完するドキュメント一覧として `graphify-out/wiki/index.md` を参照する。
          - **更新**: 既存のコード専用グラフは `graphify update .` で増分更新する。大規模な構造変更後や整合性に疑いがある場合は、上記のcode-only全面再生成を行う。
          '''

          agents = Path('AGENTS.md')
          agents_text = agents.read_text(encoding='utf-8')
          marker = '## Graphify利用ガイド\n'
          if marker not in agents_text:
              raise SystemExit('Graphify section not found in AGENTS.md')
          agents.write_text(agents_text.split(marker, 1)[0] + guide, encoding='utf-8')

          Path('.agents/rules/graphify.md').write_text(
              '''---
          trigger: always_on
          description: Consult the local Graphify knowledge graph for codebase and architecture questions.
          ---

          ''' + guide,
              encoding='utf-8',
          )

          Path('.agents/workflows/graphify.md').write_text(
              '''---
          name: graphify
          description: Query or rebuild the repository knowledge graph without external semantic extraction.
          ---

          # Workflow: graphify

          Use the existing graph first with `graphify query "<question>"`.

          When a graph must be built or fully rebuilt, use:

          ```bash
          graphify extract . --code-only --force
          ```

          For an existing code-only graph, use `graphify update .` for incremental updates.

          Do not run semantic extraction over documents, PDFs, or images, and do not configure an external API backend, unless the user explicitly approves that data flow. If Graphify is unavailable or the result is insufficient, fall back to `rg`, `grep`, and direct source inspection.
          ''',
              encoding='utf-8',
          )

          gitignore = Path('.gitignore')
          ignore_text = gitignore.read_text(encoding='utf-8')
          ignore_marker = '# Graphify generated artifacts\n'
          if ignore_marker not in ignore_text:
              raise SystemExit('Graphify block not found in .gitignore')
          ignore_block = '''# Graphify generated artifacts
          # Keep the human-readable report and wiki; ignore graph data and caches.
          /graphify-out/*
          !/graphify-out/GRAPH_REPORT.md
          !/graphify-out/wiki/
          !/graphify-out/wiki/**
          '''
          gitignore.write_text(
              ignore_text.split(ignore_marker, 1)[0] + ignore_block,
              encoding='utf-8',
          )

          wiki = Path('graphify-out/wiki/index.md')
          wiki_text = wiki.read_text(encoding='utf-8')
          wiki_text = wiki_text.replace(
              'file:///home/masaki_muramatsu/ws_PDFScoreBar/',
              '../../',
          )
          if 'file://' in wiki_text:
              raise SystemExit('A file:// link remains in graphify wiki')
          wiki.write_text(wiki_text, encoding='utf-8')
          PY

      - name: Install and verify Graphify locally
        shell: bash
        env:
          ANTHROPIC_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          MOONSHOT_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pip install --upgrade pip uv
          uvx --from graphifyy graphify --version | tee graphify-version.txt
          uvx --from graphifyy graphify extract . --code-only --force
          test -s graphify-out/graph.json
          uvx --from graphifyy graphify query \
            "detector orchestrator pipeline" \
            --graph graphify-out/graph.json \
            | tee graphify-query.txt
          test -s graphify-query.txt
          python - <<'PY'
          import json
          from pathlib import Path

          graph_path = Path('graphify-out/graph.json')
          graph = json.loads(graph_path.read_text(encoding='utf-8'))
          nodes = graph.get('nodes', [])
          edges = graph.get('edges', [])
          print(f'graph.json: {graph_path.stat().st_size} bytes')
          print(f'graph nodes: {len(nodes)}')
          print(f'graph edges: {len(edges)}')
          if not nodes:
              raise SystemExit('Graphify produced no nodes')
          PY

      - name: Record verified operating procedure
        shell: bash
        run: |
          VERSION=$(cat graphify-version.txt)
          mkdir -p docs/ai-workflow
          cat > docs/ai-workflow/GRAPHIFY.md <<EOF
          # Graphify operating procedure

          ## Scope

          Graphify is used as a local code-navigation aid. Its output is supporting evidence only; source files and tests remain authoritative.

          ## Installation

          Install the official PyPI package in an isolated tool environment:

          \`\`\`bash
          uv tool install graphifyy
          \`\`\`

          Verified in GitHub Actions on 2026-08-01 with:

          \`\`\`text
          ${VERSION}
          \`\`\`

          ## Privacy-preserving build

          This repository defaults to code-only extraction:

          \`\`\`bash
          graphify extract . --code-only --force
          \`\`\`

          This uses local AST parsing for code and skips documents, PDFs, and images. Do not run semantic extraction or configure an external API backend without explicit approval. A separately approved local backend may be used for document semantics when required.

          ## Query and update

          \`\`\`bash
          graphify query "<question>" --graph graphify-out/graph.json
          graphify update .
          \`\`\`

          Use \`graphify update .\` only for an existing code-only graph. After major structural changes, regenerate with the code-only build command above.

          ## Tracked artifacts

          - \`graphify-out/GRAPH_REPORT.md\`: tracked when generated.
          - \`graphify-out/wiki/**\`: tracked for human and agent navigation.
          - Graph data, caches, and local execution metadata remain ignored.

          ## Verification performed

          The PR validation path installs the official \`graphifyy\` package, creates a code-only graph with no API keys provided, confirms that \`graphify-out/graph.json\` contains nodes, and executes a query against that graph.
          EOF

      - name: Verify ignore rules and links
        shell: bash
        run: |
          git check-ignore --no-index -q graphify-out/graph.json
          ! git check-ignore --no-index -q graphify-out/GRAPH_REPORT.md
          ! git check-ignore --no-index -q graphify-out/wiki/index.md
          ! grep -R "file://" graphify-out/wiki docs/ai-workflow/GRAPHIFY.md

      - name: Run repository lint
        shell: bash
        run: make lint

      - name: Commit refined files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .agents/rules/graphify.md \
            .agents/workflows/graphify.md \
            .gitignore \
            AGENTS.md \
            docs/ai-workflow/GRAPHIFY.md \
            graphify-out/wiki/index.md
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            git add graphify-out/GRAPH_REPORT.md
          fi
          if git diff --cached --quiet; then
            echo "No refinement changes to commit"
            exit 0
          fi
          git commit -m "fix: refine Graphify local-only integration [graphify-refine]"
          git push origin HEAD:task/introduce-graphify

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue258-graphify-verification
          path: |
            graphify-version.txt
            graphify-query.txt
            graphify-out/graph.json
          if-no-files-found: error
          retention-days: 7
