name: PR validation

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  lint:
    name: make lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv for ruff entrypoints
        run: python -m pip install --upgrade pip uv

      - name: Run ruff lint and format check
        run: make lint

  telemetry-contract-tests:
    name: issue339 focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run engine telemetry contract tests
        run: PYTHONPATH=. python -m pytest tests/test_engine_contract.py tests/test_engine_telemetry.py

      - name: Run config-runner telemetry entrypoint tests
        run: |
          PYTHONPATH=. python - <<'PY'
          import sys
          import types

          import pytest

          stub = types.ModuleType("src.pipeline.orchestrator")
          stub.PipelineOrchestrator = object
          sys.modules["src.pipeline.orchestrator"] = stub

          raise SystemExit(pytest.main(["tests/test_pipeline_telemetry.py", "-q"]))
          PY
