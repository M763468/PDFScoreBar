name: PR validation

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  lint:
    name: make lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation tools
        run: python -m pip install --upgrade pip uv pytest

      - name: Run ruff lint and format check
        run: make lint

      - name: Run Issue 352 focused tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_model_artifacts.py tests/test_docker_runtime_contract.py
          bash -n scripts/docker_runtime_validation.sh scripts/gpu_smoke.sh
          python -m py_compile scripts/docker_image_resolver.py src/common/model_artifacts.py docker/runtime_contract.py
          make help >/dev/null
