name: PR validation

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  lint:
    name: make lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check documentation translation provenance
        run: |
          python3 tools/verification/check_doc_translations.py
          python3 -m unittest discover -s tests -p test_doc_translations.py

      - name: Check local Markdown links and fragments
        run: |
          python3 tools/verification/check_doc_links.py
          python3 -m unittest discover -s tests -p test_doc_links.py

      - name: Check Makefile repository references
        run: make check-makefile

      - name: Install uv for ruff entrypoints
        run: python -m pip install --upgrade pip uv

      - name: Run ruff lint and format check
        run: make lint


  engine-contract:
    name: engine contract compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight contract-test dependencies
        # numpy==2.5.3 from pyproject.toml needs Python >=3.12; this job runs 3.10.
        run: python -m pip install --upgrade pip pytest Pillow PyMuPDF PyYAML psutil numpy==2.2.6

      - name: Check service-readiness shell syntax
        run: bash -n scripts/docker_runtime_validation.sh

      - name: Compile service-readiness entrypoints
        run: python -m compileall -q src/pipeline/engine_executor.py tools/verification/verify_engine_service_readiness.py

      - name: Check configuration reference drift
        run: python -m pytest tests/test_configuration_reference.py

      - name: Run engine compatibility gate
        run: >-
          PYTHONPATH=. python -m pytest
          tests/test_engine_contract.py
          tests/test_engine_input_safety.py
          tests/test_engine_telemetry.py
          tests/test_job_lifecycle.py
          tests/test_engine_service_readiness.py
          tests/test_corrected_final_output.py
          tests/test_final_pdf_page_size.py

  lightweight-tests:
    name: fast and Node contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest Pillow PyMuPDF==1.26.4 PyYAML psutil numpy opencv-python-headless scipy tqdm
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run maintained fast tests
        run: make test-fast PYTHON=python || { cat artifacts/test_fast.log; exit 1; }
      - name: Run Node contracts
        run: make test-node-contract PYTHON=python
