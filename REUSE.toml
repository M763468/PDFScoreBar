# First-party MMR classifier weight (2026-11-27 owner decision, Option A, Issues #505/#550):
# AGPL-3.0-or-later applies to the owner's rights in this checkpoint. Fine-tuned from
# torchvision ResNet18 IMAGENET1K_V1 weights on crops of score pages; training score pages,
# PDFs, and crops are not distributed, and third-party rights are not relicensed (see NOTICE
# and THIRD_PARTY_NOTICES.md).
[[annotations]]
path = "models/mmr/mmr_classifier_best.pth"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Masaki Muramatsu"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Evaluation / ground-truth / training-related data derived from third-party scores.
[[annotations]]
path = [
    "data/evaluation2/**",
    "configs/cnn_barline_runs/issue44_baseline_v1/fixtures/**",
    "experiments/issue333/corpus.json",
    "experiments/issue333/phase25_ground_truth.json",
    "experiments/issue333/results/**",
    "tools/issue522/evidence/*.jpg",
    "tools/issue522/evidence/review_audit.json",
    "tools/issue415/reviewed_gt.json",
