version = 1
SPDX-PackageName = "PDFScoreBar"
SPDX-PackageDownloadLocation = "https://github.com/M763468/PDFScoreBar"

# Path-level licensing declarations (Issue #505). Per-file SPDX headers are optional.
# The repository license applies to first-party material. Files whose rights status is not
# established are declared LicenseRef-PDFScoreBar-NotLicensed and are NOT covered by AGPL.
# See NOTICE and docs/licensing/REPOSITORY_LICENSE_OPTIONS.md.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Masaki Muramatsu"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Contains short quoted HOMR source fragments used as exact patch targets. HOMR declares
# "AGPL-3.0" without stating "or later"; the fragments are treated as AGPL-3.0-only.
[[annotations]]
path = "docker/patch_homr_onnx_provider.py"
precedence = "override"
SPDX-FileCopyrightText = [
    "2025-2026 Masaki Muramatsu",
    "HOMR authors (https://github.com/liebharc/homr)",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND AGPL-3.0-only"

# First-party model weight: license to be determined separately (ImageNet initialization,
# score-derived training data).
[[annotations]]
path = "models/mmr/mmr_classifier_best.pth"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Masaki Muramatsu"
SPDX-License-Identifier = "LicenseRef-PDFScoreBar-NotLicensed"

# Evaluation / ground-truth / training-related data derived from third-party scores.
[[annotations]]
path = [
    "data/evaluation2/**",
    "configs/cnn_barline_runs/issue44_baseline_v1/fixtures/**",
    "experiments/issue333/corpus.json",
    "experiments/issue333/phase25_ground_truth.json",
    "experiments/issue333/results/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Masaki Muramatsu"
SPDX-License-Identifier = "LicenseRef-PDFScoreBar-NotLicensed"

# Test fixtures derived from third-party scores. The synthetic issue218_3div*/4div* fixtures
# are regenerated byte-for-byte by generate_issue218.py and remain first-party (AGPL).
[[annotations]]
path = [
    "tests/fixtures/expected_overrides_page_*.json",
    "tests/fixtures/movement_boundaries/**",
    "tests/fixtures/system_grouping/issue218_la_mer.json",
    "tests/fixtures/system_grouping/issue218_measure_gt.json",
    "tests/fixtures/system_grouping/issue218_real_detection.json",
    "tests/fixtures/system_grouping/issue218_real_score.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Masaki Muramatsu"
SPDX-License-Identifier = "LicenseRef-PDFScoreBar-NotLicensed"

# Graphify (development-only navigation tool; not in the runtime distribution).
# Third-party: these reference files are byte-identical to graphify/skills/*/references/ in the
# installed graphifyy 0.9.41 package (https://github.com/Graphify-Labs/graphify), whose package
# metadata declares Apache-2.0. Its NOTICE is reproduced in the repository NOTICE.
[[annotations]]
path = ".agents/skills/graphify/references/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Safi Shamsi and the Graphify contributors"
SPDX-License-Identifier = "Apache-2.0"

# First-party derived: generated by Graphify 0.9.41 in code-only mode (no semantic/LLM route)
# from first-party source at 3ff2800b (graphify-out/MANIFEST.json). Its nodes reference only
# first-party code and model manifests, not excluded data. `.graphify_version` is the installer's
# version stamp. The SKILL.md and workflow are repository-specific and keep the default above.
[[annotations]]
path = [
    "graphify-out/**",
    ".agents/skills/graphify/.graphify_version",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Masaki Muramatsu"
SPDX-License-Identifier = "AGPL-3.0-or-later"
