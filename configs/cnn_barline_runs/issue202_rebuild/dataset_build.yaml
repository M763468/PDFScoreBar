output_root: datasets/cnn_classifier_v8_base_issue202
deepscores_root: /mnt/d/datasets/DeepScoresV2/ds2_dense

# evaluation2 GT / image / candidate set
eval2_annotations_root: data/evaluation2/annotations
eval2_images_root: data/evaluation2/images
eval2_candidates_root: data/evaluation2/golden_baseline_eval2_bc23deb
eval2_candidate_file: pipeline2_no_peak_candidates.json

# DeepScores extraction settings
max_per_image: 5
max_total: 10000
neg_prefix: [stem, clef, key, accidental, rest, notehead, beam]
neg_name: [ledgerLine, legerLine]
tp_palette_index: 3
tp_min_area: 30
tp_min_height: 30
tp_max_total: 10000
tp_seg_offset: 0
tp_seg_count: 500

# Candidate-to-crop conversion
crop_width: 128
crop_height: 256
crop_scale: 3.0
min_crop_height: 48
max_crop_height: 256
iou_threshold: 0.5

# Dataset size / split reproducibility
seed: 44
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1

skip_local: True
skip_eval2: False
skip_deepscores: False

# FORCE problematic pages into train split
force_train:
  - Sibelius-Violin_Concerto-Viola_page_004
  - Shostakovich-Sym5-Va_page_003
  - Va_Prokofiev_Symphony1_page_005
  - Shostakovich-Festival_Overture_Va_page_004
  - Va__Prokofiev_Symphony5_page_015
  - Va__Prokofiev_Symphony5_page_002
  - Va__Prokofiev_Symphony5_page_004
  - Sibelius-Violin_Concerto-Viola_page_006
