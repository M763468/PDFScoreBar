# E46-COMB-002 experiment scoring config
# Usage:
#   .venv_cnn_classifier/bin/python tools/cnn_classifier/score_candidates_batch.py \
#     --config configs/cnn_barline_runs/issue44_baseline_v1/score_candidates_batch_croprecenter_v1.yaml
#
# Notes:
# - This config is for the E46 experimental root copied from the issue44 baseline scoring output.
# - `logs` may be overridden to test the same option on other scoring roots.

logs: logs/cnn_barline_classification/issue44_baseline_v1/scoring_input_eval2_v12_same_source_bboxnorm_w0p8_h4p0_patch10_croprecenter_v1
images_root: data/evaluation2/images
model: logs/cnn_barline_classification/issue44_baseline_v1/cnn_classifier_best.pth
threshold: 0.1
candidate_filename: pipeline2_no_peak_candidates.json
scored_filename: pipeline2_no_peak_scored.json
filtered_filename: pipeline2_no_peak_filtered_cnn.json
overwrite: true

# E46-COMB-002: score-side crop representation tweak
crop_recenter_on_bbox_ink: true
crop_recenter_min_aspect_ratio: 3.0
crop_recenter_apply_if_width_le_unit_ratio: 1.0
crop_recenter_mask_ratio: 0.85
crop_recenter_max_shift_unit_ratio: 0.35
