# Issue #44 Iter 5 (Rescue + Hard Mining) dataset build
# Usage:
#   python tools/cnn_classifier/build_cnn_dataset.py --config configs/cnn_barline_runs/issue44_iter5_rescue/dataset_build.yaml

output_root: datasets/cnn_classifier_v5_rescue_iter1
deepscores_root: /mnt/d/datasets/DeepScoresV2/ds2_dense

# evaluation2 GT / image / candidate set (Gap Rescue enabled candidates)
eval2_annotations_root: data/evaluation2/annotations
eval2_images_root: data/evaluation2/images
eval2_candidates_root: logs/issue53_full_eval_rescue_v1
eval2_candidate_file: pipeline2_no_peak_scored.json

# DeepScores extraction settings (standardized TP/FP symbols)
# Same as previous best datasets for consistency
max_per_image: 5
max_total: 10000
neg_prefix:
  - stem
  - clef
  - key
  - accidental
  - rest
  - notehead
  - beam
neg_name:
  - ledgerLine
  - legerLine
tp_palette_index: 3
tp_min_area: 30
tp_min_height: 30
tp_max_total: 10000
tp_seg_offset: 0
tp_seg_count: 500

# Candidate-to-crop conversion
crop_width: 128
crop_height: 256
crop_scale: 3.0
min_crop_height: 48
max_crop_height: 256
iou_threshold: 0.5

# Dataset size / split reproducibility
seed: 44
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1

# Combine current evaluation2 + DeepScores
skip_local: True
skip_eval2: False
skip_deepscores: False

force_train:
  - eval2
  - deepscores
