run:
  run_id: eval2_bypass_sr_test_v2
  output_root: logs/full_pipeline_runs/bypass_sr_test

inputs:
  pdf_path: data/evaluation2/pdfs/Va_Prokofiev_Symphony1.pdf
  pdf_to_images:
    output_dir: logs/preprocess/evaluation2/Va_Prokofiev_Symphony1
    dpi: 360
    pages: "1"
    interpolation: area
    prefix: page
    format: png
    overwrite: true
    alpha: false
    image_glob: page_*.png

steps:
  pdf_to_images: true
  detection: true
  filter_pages: true
  apply_barline_overrides: false
  numbering_base: true
  mmr_overrides: true
  apply_measure_overrides: true
  overlay: true

detection:
  enable_sr: false
  crop_recenter_on_bbox_ink: true
  container_name: sr_eval_gpu_exp
  hybrid_output_root: logs/hybrid_generalization/bypass_sr_test
  ink_threshold: 180
  min_ratio: 0.70
  min_height_ratio: 0.012
  cnn_model_path: logs/cnn_barline_classification/issue44_iter7_final_rescue_v1/cnn_classifier_best.pth
  cnn_threshold: 0.1
  divisi_rescue: true
  scan_gap_rescue: true
  scan_x_peak_rescue: true
  post_split_wide_candidates: true
  post_split_min_width_unit_ratio: 0.5
  post_split_box_width_unit_ratio: 0.4
  post_split_peak_distance_unit_ratio: 0.3
  staff_mask_dir: !!null

filters:
  blank_page: auto
  staff_detect: auto

mmr:
  model_path: tools/mmr_training/models/mmr_classifier_best.pth
  enable_rotation_tta: false

numbering:
  force_single_system: false
