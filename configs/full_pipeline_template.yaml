run:
  run_id: null
  output_root: logs/full_pipeline_runs

inputs:
  pdf_path: data/scores/demo/score.pdf
  pdf_to_images:
    output_dir: logs/preprocess/demo_pages
    dpi: 300
    pages: null
    target_width: null
    target_height: null
    interpolation: area
    prefix: page
    format: png
    overwrite: false
    alpha: false
    image_glob: page_*.png
  barlines_root: logs/hybrid_generalization
  barlines_pattern: "{page_run}/pipeline2_no_peak_filtered_cnn.json"
  staff_mask_pattern: "{page_run}/baseline/{page_id}/{page_id}/{page_id}_debug_3_staff.png"
  page_runs:
    - eval2_prokofiev1_page_001
  barline_overrides: null
  barline_overrides_config:
    iou_threshold: 0.5
    min_width: 12
    x_margin: 3
    y_margin: 3
  measure_overrides: null

steps:
  pdf_to_images: true
  detection: true
  filter_pages: true
  apply_barline_overrides: true
  numbering_base: true
  mmr_overrides: true
  apply_measure_overrides: true
  overlay: false

detection:
  enable_sr: true
  sr_scale: 2 # Default for high-precision mode (achieves SR x4 accuracy with better speed)
  crop_recenter_on_bbox_ink: true
  crop_recenter_max_shift_unit_ratio: 0.5
  container_name: sr_eval_gpu_exp
  hybrid_output_root: logs/hybrid_generalization
  ink_threshold: 180
  min_ratio: 0.85
  min_height_ratio: 0.012
  cnn_model_path: logs/cnn_barline_classification/issue44_iter7_final_rescue_v1/cnn_classifier_best.pth
  cnn_threshold: 0.1
  divisi_rescue: true
  scan_gap_rescue: true
  scan_x_peak_rescue: true
  scan_center_on_peak: true
  max_per_band: 200
  post_split_wide_candidates: true
  post_split_min_width_unit_ratio: 0.5
  post_split_box_width_unit_ratio: 0.4
  post_split_peak_distance_unit_ratio: 0.3
  staff_mask_dir: !!null
  # Optional: force specific hybrid script path if needed
  # hybrid_script: tools/run_hybrid_pipeline.sh

filters:
  blank_page: auto
  blank_page_config:
    pixel_threshold: 245
    max_ink_ratio: 0.003
    max_stddev: 12.0
  staff_detect: auto
  staff_detect_config:
    min_nonzero_ratio: 0.001
  user_exclude: []

mmr:
  model_path: models/mmr_cnn.pt
  ocr_lang: eng
  enable_rotation_tta: false
  debug_root: null

numbering:
  config_path: null
  force_single_system: false
