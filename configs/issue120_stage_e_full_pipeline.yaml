# HISTORICAL REPRODUCTION CONFIG ONLY.
#
# This file is consumed by the Issue #120 Stage E audit runner and is retained
# for historical regression/provenance. It is not a production default or a
# template for user-facing/corrected runs. New production runs must use the
# production_dense_v1 contract documented in docs/dev/DETECTOR_BASELINE_MATRIX.md.
# In particular, do not copy only these detector fields and omit the 360 dpi PDF
# input contract. The Stage E runner supplies pre-rendered evaluation images and
# injects reconstructed candidate artifacts before entering the pipeline.

run:
  run_id: issue120_stage_e_full_pipeline
  output_root: logs/issue120_e2e_recovery

inputs:
  pdf_to_images:
    output_dir: data/evaluation2/images
    image_glob: page_*.png

steps:
  pdf_to_images: false
  detection: true
  filter_pages: true
  apply_barline_overrides: false
  numbering_base: true
  mmr_overrides: true
  apply_measure_overrides: true
  overlay: false

detection:
  enable_sr: true
  sr_scale: 2
  crop_recenter_on_bbox_ink: true
  container_name: sr_eval_gpu_exp
  hybrid_output_root: logs/issue120_e2e_recovery/stage_e_hybrid_output

  # Historical full-pipeline checkpoint repair. The Stage E runner reconstructs
  # and injects the recovered dense-route candidates before running this config.
  band_source: row_stats
  band_cluster_max_dist: 25.0
  ink_threshold: 240
  min_ratio: 0.60
  min_height_ratio: 0.006
  min_width_ratio: 0.0
  probe_width: 4
  max_per_band: 80
  enable_heuristic_filters: true
  candidate_filter_kwargs:
    left_margin_ratio: 0.12
    clef_left_ratio: 0.25
    min_height_median_ratio: 0.6
    ink_threshold: 180
    min_ink_ratio: 0.18
    paper_threshold: 200
    min_paper_overlap_ratio: 0.6
    min_staff_overlap_ratio: 0.02

  cnn_model_path: logs/cnn_barline_classification/issue44_iter7_final_rescue_v1/cnn_classifier_best.pth
  cnn_threshold: 0.1
  cnn_apply_nms: false
  divisi_rescue: true
  scan_gap_rescue: true
  scan_gap_threshold_ratio: 1.5
  scan_gap_rescue_min_ratio: 0.3
  scan_x_peak_rescue: true
  scan_rightmost_rescue: true
  scan_center_on_peak: true

filters:
  blank_page: auto
  blank_page_config:
    pixel_threshold: 245
    max_ink_ratio: 0.003
    max_stddev: 12.0
  staff_detect: auto
  staff_detect_config:
    min_nonzero_ratio: 0.001
  user_exclude: []

mmr:
  model_path: tools/mmr_training/models/mmr_classifier_best.pth
  ocr_lang: eng
  enable_rotation_tta: false

numbering:
  force_single_system: false
