run:
  run_id: issue333_provenance_smoke
  output_root: logs/issue333/hardening_smoke
inputs:
  pdf_path: /source-evaluation2/pdfs/Va_Prokofiev_Symphony1.pdf
  pdf_to_images:
    output_dir: logs/issue333/hardening_smoke/rendered
    dpi: 300
    pages: "1"
    interpolation: area
    prefix: page
    format: png
    overwrite: true
    alpha: false
    image_glob: page_*.png
  barlines_root: logs/issue333/hardening_smoke
  barlines_pattern: "{page_run}/barlines.json"
  staff_mask_pattern: "{page_run}/staff.png"
  page_runs: []
steps:
  pdf_to_images: true
  detection: true
  filter_pages: true
  apply_barline_overrides: false
  numbering_base: true
  mmr_overrides: true
  apply_measure_overrides: true
  overlay: false
detection:
  sr_scale: 2
  container_name: sr_eval_gpu_exp
  hybrid_output_root: logs/issue333/hardening_smoke/hybrid
  ink_threshold: 230
  min_ratio: 0.70
  min_height_ratio: 0.012
  cnn_model_path: /opt/pdfscore-assets/barline_cnn_smoke.pth
  cnn_threshold: 0.1
mmr:
  model_path: tools/mmr_training/models/mmr_classifier_best.pth
  enable_rotation_tta: true
  threshold: 0.5
filters:
  blank_page: auto
  staff_detect: auto
numbering:
  force_single_system: false
