# Definitive configuration for reproducing 100% recall (based on PR #77 conditions)
run_id: "repro_100_percent"
output_root: "logs/full_pipeline_runs/repro_100_percent"

inputs:
  pdf_path: "data/evaluation2/pdfs/Shostakovich-Festival_Overture_Va.pdf"
  pdf_to_images:
    output_dir: "data/workbench/repro_100_percent"
    dpi: 360
    interpolation: "area"
    prefix: "page"
    format: "png"
    overwrite: true
    alpha: false

steps:
  pdf_to_images: true
  detection: true
  numbering: true

detection:
  hybrid_output_root: "logs/hybrid_generalization/repro_100_percent"
  enable_sr: true
  sr_scale: 2
  stem_context_heuristics_enabled: false
  enable_end_barline_recovery: true
  
  # Crucial parameters restored from PR #77 era to achieve 100% recall
  ink_threshold: 180
  min_ratio: 0.50
  cnn_model_path: "logs/cnn_barline_classification/issue44_iter7_final_rescue_v1/cnn_classifier_best.pth"
  cnn_threshold: 0.1
  max_per_band: 200
  post_split_wide_candidates: true
  staff_mask_dir: !!null
  crop_recenter_on_bbox_ink: true
  crop_recenter_max_shift_unit_ratio: 0.5
  divisi_rescue: true
  scan_gap_rescue: true
  scan_x_peak_rescue: true

numbering:
  enabled: true
  output_root: "logs/numbering/repro_100_percent"
