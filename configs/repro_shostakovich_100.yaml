run:
  run_id: shostakovich_repro_100
  output_root: logs/full_pipeline_runs/shostakovich_repro_100

inputs:
  pdf_path: data/evaluation2/pdfs/Shostakovich-Festival_Overture_Va.pdf
  pdf_to_images:
    output_dir: logs/preprocess/evaluation2/Shostakovich-Festival_Overture_Va_360dpi
    dpi: 360
    pages: "1,2,3,4,5,6,7,8,9"
    interpolation: area
    prefix: page
    format: png
    overwrite: false

steps:
  pdf_to_images: true
  detection: true
  filter_pages: true
  apply_barline_overrides: false
  numbering_base: true
  mmr_overrides: false
  apply_measure_overrides: false
  overlay: true

detection:
  enable_sr: true
  sr_scale: 2
  crop_recenter_on_bbox_ink: true
  crop_recenter_max_shift_unit_ratio: 0.5
  hybrid_output_root: logs/hybrid_generalization/shostakovich_repro_100
  ink_threshold: 180
  min_ratio: 0.85
  min_height_ratio: 0.012
  cnn_model_path: logs/cnn_barline_classification/issue44_iter7_final_rescue_v1/cnn_classifier_best.pth
  cnn_threshold: 0.1
  divisi_rescue: true
  scan_gap_rescue: true
  scan_x_peak_rescue: true
  scan_center_on_peak: true
  max_per_band: 200
  post_split_wide_candidates: true
  post_split_min_width_unit_ratio: 0.5
  post_split_box_width_unit_ratio: 0.4
  post_split_peak_distance_unit_ratio: 0.3
  stem_context_heuristics_enabled: false
  enable_end_barline_recovery: false

filters:
  blank_page: auto
  staff_detect: auto

mmr:
  model_path: tools/mmr_training/models/mmr_classifier_best.pth
  enable_rotation_tta: false

numbering:
  force_single_system: false
