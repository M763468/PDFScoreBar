# Example fragment for enabling config-first manual correction review packages.
# For production-accuracy review, merge this into the current production config
# (configs/dense_full_pipeline.yaml or an explicitly equivalent derivative).
# Workflow-only/legacy smoke configs are valid for GUI mechanics but must not be
# interpreted as production detector-accuracy evidence.
outputs:
  review:
    manual_correction_package: true
    # Optional. Relative paths are resolved from the internal run_dir.
    root: review
    # Optional trace metadata copied into review/manual_correction_input.json.
    source_pipeline_command: null
