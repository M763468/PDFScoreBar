run:
  run_id: smoke_test_detection_20260120
  output_root: logs/full_pipeline_runs

inputs:
  pdf_path: data/evaluation2/pdfs/Va_Prokofiev_Symphony1.pdf
  pdf_to_images:
    output_dir: data/workbench/smoke_test_prokofiev1
    dpi: 300
    pages: "1"
    interpolation: area
    prefix: page
    format: png
    overwrite: true
    alpha: false
    image_glob: page_*.png
  # Legacy inputs (required but ignored when detection is enabled)
  barlines_root: logs/hybrid_generalization
  barlines_pattern: "{page_run}/pipeline2_no_peak_filtered_cnn.json"
  staff_mask_pattern: "{page_run}/baseline/{page_id}/{page_id}/{page_id}_debug_3_staff.png"
  page_runs: []

steps:
  pdf_to_images: true
  detection: true
  filter_pages: true
  apply_barline_overrides: false
  numbering_base: true
  mmr_overrides: false
  apply_measure_overrides: false
  overlay: true

detection:
  container_name: sr_eval_gpu_exp
  hybrid_output_root: logs/hybrid_generalization
  ink_threshold: 230
  min_ratio: 0.70
  min_height_ratio: 0.012
  cnn_model_path: logs/cnn_retrain_v3_final/cnn_classifier_best.pth
  cnn_threshold: 0.1

filters:
  blank_page: auto
  staff_detect: auto

numbering:
  force_single_system: false
