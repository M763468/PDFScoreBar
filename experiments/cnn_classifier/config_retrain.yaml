# --- Paths ---
work_dir: "logs/cnn_barline_classification/training_resnet18_hard_negative_mining"
# tp_dir/fp_dir deliberately OMITTED to allow train.py to use DATASET_ROOT splits

# --- Data & Model ---
model_name: "resnet18"
img_size: [256, 128]
epochs: 30
batch_size: 320
learning_rate: 0.001
weight_decay: 0.01
seed: 42
train_val_split: 0.8  # Ignored when splits exist

# --- System / Speed ---
num_workers: 8
prefetch_factor: 2
amp: true
compile: true
compile_mode: "reduce-overhead"
channels_last: true

# --- Imbalance & Training ---
imbalance: "sampler"
freeze_backbone_epochs: 1

# --- Augmentation (GPU) ---
no_augment: false
sp_p: 0.3
sp_density: 0.02

# --- Evaluation ---
optimize_threshold: true
save_interval: 5

# --- Debug / Profiling ---
timing: true
