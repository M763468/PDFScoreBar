<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phase5b Review Tool</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; }
      #sidebar { width: 320px; padding: 12px; border-right: 1px solid #ccc; overflow-y: auto; }
      #main { flex: 1; display: flex; flex-direction: column; }
      #toolbar { padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #canvas { flex: 1; background: #111; }
      .label-btn { padding: 4px 8px; margin: 2px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; }
      .label-btn.active { background: #cde8ff; border-color: #2b78c5; }
      .list-item { padding: 4px; border-bottom: 1px solid #eee; cursor: pointer; }
      .list-item.active { background: #eef6ff; }
      .small { font-size: 12px; color: #555; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div><strong>Page</strong></div>
      <select id="pageSelect"></select>
      <div class="small" id="pageMeta"></div>
      <hr />
      <div><strong>Filter</strong></div>
      <select id="categoryFilter"></select>
      <hr />
      <div><strong>Labels</strong></div>
      <div id="labelButtons"></div>
      <button id="clearLabel" class="label-btn">Clear Label</button>
      <hr />
      <button id="saveBtn" class="label-btn">Save Labels</button>
      <button id="summaryBtn" class="label-btn">Export Summary</button>
      <div class="small" id="status"></div>
      <hr />
      <div><strong>Boxes</strong></div>
      <div id="boxList"></div>
    </div>
    <div id="main">
      <div id="toolbar">
        <label><input type="checkbox" id="showOverlay" checked /> Show overlay</label>
        <label><input type="checkbox" id="showBoxes" checked /> Show boxes</label>
        <span class="small">Click box to label</span>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <script src="app.js"></script>
  </body>
</html>
