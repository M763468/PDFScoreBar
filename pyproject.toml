[project]
name = "ws-pdfscorebar-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
# Target version
target-version = "py310"
line-length = 100
exclude = ["external"]

[tool.ruff.lint]
# Enable Pyflakes (E) and pycodestyle (W) codes by default.
select = ["E", "F", "I"]
# E501: Line too long (handled by formatter)
# E402: Module level import not at top of file (common in scripts with sys.path hacks)
ignore = ["E501", "E402"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["common", "homr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
