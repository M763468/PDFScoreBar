[project]
name = "pdfscore-pipeline"
version = "0.1.0"
description = "PDF Score Barline Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "PyMuPDF==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "onnxruntime-gpu==1.24.3",
    "pillow==11.3.0",
    "scipy==1.15.3",
    "scikit-learn==1.2.0",
    "matplotlib==3.10.6",
    "coloredlogs==15.0.1",
    "ultralytics==8.3.239",
    "rapidocr-onnxruntime==1.4.4",
]

[tool.ruff]
# Target version
target-version = "py310"
line-length = 100
exclude = ["external"]

[tool.ruff.lint]
# Enable Pyflakes (E) and pycodestyle (W) codes by default.
select = ["E", "F", "I"]
# E501: Line too long (handled by formatter)
# E402: Module level import not at top of file (common in scripts with sys.path hacks)
ignore = ["E501", "E402"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["common", "homr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
