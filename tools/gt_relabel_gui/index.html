<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GT Relabel Editor</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
      #sidebar { width: 320px; border-right: 1px solid #ccc; padding: 12px; overflow-y: auto; }
      #main { flex: 1; display: flex; flex-direction: column; }
      #toolbar { padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #canvas { flex: 1; background: #111; }
      .btn { padding: 6px 10px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; }
      .btn.active { background: #cde8ff; border-color: #2b78c5; }
      .list-item { padding: 4px; border-bottom: 1px solid #eee; cursor: pointer; }
      .list-item.active { background: #eef6ff; }
      .small { font-size: 12px; color: #555; }
      .status-row { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div><strong>Items</strong></div>
      <div class="small" id="itemMeta"></div>
      <div class="status-row">
        <button id="prevBtn" class="btn">Prev</button>
        <button id="nextBtn" class="btn">Next</button>
      </div>
      <hr />
      <div><strong>Status</strong></div>
      <button id="statusUnchanged" class="btn">unchanged</button>
      <button id="statusEdited" class="btn">edited</button>
      <button id="statusInvalid" class="btn">invalid</button>
      <div class="status-row">
        <button id="saveBtn" class="btn">Save</button>
      </div>
      <div class="small" id="saveStatus"></div>
      <hr />
      <div id="itemList"></div>
    </div>
    <div id="main">
      <div id="toolbar">
        <span class="small">Drag box to move, drag corner handles to resize.</span>
        <span class="small">Hotkeys: U=unchanged, E=edited, I=invalid, S=save, ←/→ prev/next</span>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <script src="app.js"></script>
  </body>
</html>
