<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GT Editor</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
      #sidebar { width: 320px; border-right: 1px solid #ccc; padding: 12px; overflow-y: auto; }
      #main { flex: 1; display: flex; flex-direction: column; }
      #toolbar { padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      #canvas { flex: 1; background: #111; cursor: crosshair; }
      .btn { padding: 6px 10px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; }
      .btn.active { background: #cde8ff; border-color: #2b78c5; }
      .list-item { padding: 4px; border-bottom: 1px solid #eee; cursor: pointer; }
      .list-item.active { background: #eef6ff; }
      .small { font-size: 12px; color: #555; }
      .row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
      .legend span { display: inline-flex; align-items: center; gap: 4px; }
      .dot { width: 10px; height: 10px; display: inline-block; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div><strong>Pages</strong></div>
      <div class="small" id="pageMeta"></div>
      <div class="row">
        <button id="prevBtn" class="btn">Prev</button>
        <button id="nextBtn" class="btn">Next</button>
      </div>
      <hr />
      <div><strong>Controls</strong></div>
      <div class="row">
        <button id="modeSelectBtn" class="btn active">Select</button>
        <button id="modeDrawBtn" class="btn">Draw</button>
        <button id="deleteBtn" class="btn">Delete</button>
      </div>
      <div class="row">
        <label class="small" for="typeSelect">Type</label>
        <select id="typeSelect">
          <option value="barline">barline</option>
          <option value="end_barline">end_barline</option>
          <option value="double_barline">double_barline</option>
          <option value="repeat">repeat</option>
        </select>
      </div>
      <div class="row">
        <button id="saveBtn" class="btn">Save</button>
      </div>
      <div class="small" id="saveStatus"></div>
      <hr />
      <div><strong>Layers</strong></div>
      <div class="row" id="layerList"></div>
      <hr />
      <div class="small">
        Zoom: mouse wheel<br />
        Pan: space+drag or middle mouse<br />
        Draw: drag to create box<br />
        Delete: Del / Backspace
      </div>
      <div class="row">
        <div class="small" id="stats"></div>
      </div>
      <hr />
      <div id="pageList"></div>
    </div>
    <div id="main">
      <div id="toolbar">
        <div class="legend" id="legend"></div>
        <span class="small">Editable = cyan, Selected = orange, Draw preview = red.</span>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <script src="app_gt.js"></script>
  </body>
</html>
