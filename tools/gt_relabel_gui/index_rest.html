<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multi-Measure Rest GT</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
      #sidebar { width: 360px; border-right: 1px solid #ccc; padding: 12px; overflow-y: auto; }
      #main { flex: 1; display: flex; flex-direction: column; }
      #toolbar { padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      #canvas { flex: 1; background: #111; cursor: crosshair; }
      .btn { padding: 6px 10px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; }
      .btn.active { background: #cde8ff; border-color: #2b78c5; }
      .list-item { padding: 4px; border-bottom: 1px solid #eee; cursor: pointer; }
      .list-item.active { background: #eef6ff; }
      .small { font-size: 12px; color: #555; }
      .row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
      .dot { width: 10px; height: 10px; display: inline-block; border: 1px solid #333; }
      #measureList { max-height: 45vh; overflow-y: auto; border: 1px solid #eee; }
      input[type="number"] { width: 80px; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div><strong>Pages</strong></div>
      <div class="small" id="pageMeta"></div>
      <div class="row">
        <button id="prevBtn" class="btn">Prev</button>
        <button id="nextBtn" class="btn">Next</button>
      </div>
      <hr />
      <div><strong>Selected Measure</strong></div>
      <div class="row small" id="selectedMeta">None</div>
      <div class="row">
        <label class="small">Rest count</label>
        <input id="restCountInput" type="number" min="1" value="1" />
        <button id="applyBtn" class="btn">Apply</button>
        <button id="resetBtn" class="btn">Set 1</button>
      </div>
      <div class="row">
        <button id="saveBtn" class="btn">Save</button>
      </div>
      <div class="small" id="saveStatus"></div>
      <div class="small" id="dirtyStatus"></div>
      <hr />
      <div><strong>Legend</strong></div>
      <div class="legend">
        <span><span class="dot" style="background:#3aa3ff;"></span>Measure</span>
        <span><span class="dot" style="background:#ff4d4f;"></span>Multi-rest (&gt;1)</span>
        <span><span class="dot" style="background:#ffa940;"></span>Selected</span>
      </div>
      <hr />
      <div><strong>Measures</strong></div>
      <div class="small">Click a box or a list item to edit.</div>
      <div id="measureList"></div>
      <hr />
      <div class="small">
        Zoom: mouse wheel<br />
        Pan: space+drag or middle mouse
      </div>
    </div>
    <div id="main">
      <div id="toolbar">
        <span class="small">Drawn numbers are ROI indices on the page.</span>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <script src="app_rest.js"></script>
  </body>
</html>
